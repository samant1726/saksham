<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Galaxy | Logistics & Commerce</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap');

        /* CORE THEME */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Quicksand', sans-serif; }
        body {
            background: linear-gradient(-45deg, #020c1b, #0a192f, #0072ff, #7f00ff, #e100ff, #2d0036);
            background-size: 400% 400%;
            animation: galaxyFlow 12s ease infinite;a
            min-height: 100vh; color: white; overflow-x: hidden;
        }
        @keyframes galaxyFlow { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        /* NAVBAR */
        .navbar {
            display: flex; align-items: center; justify-content: space-between;
            padding: 20px 50px; background: rgba(0,0,0,0.5); backdrop-filter: blur(20px);
            position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        /* CARDS & UI */
        .container { max-width: 1300px; margin: 0 auto; padding: 40px 20px; display: none; }
        .container.active { display: block; }
        .glass-card {
            background: rgba(255, 255, 255, 0.95); color: #1a1a1a;
            padding: 30px; border-radius: 30px; box-shadow: 0 15px 40px rgba(0,0,0,0.3); margin-bottom: 25px;
        }
        .neon-btn {
            width: 100%; padding: 15px; border-radius: 50px; border: none;
            background: linear-gradient(135deg, #00c6ff, #7f00ff);
            color: white; font-weight: 800; cursor: pointer; transition: 0.3s;
        }
        .neon-btn:hover { opacity: 0.9; transform: scale(1.02); }
        input, select { width: 100%; padding: 12px; margin: 10px 0; border-radius: 12px; border: 2px solid #eee; }

        /* TRACKING PROGRESS BAR */
        .track-container { margin-top: 20px; display: flex; justify-content: space-between; position: relative; }
        .track-container::before { content: ''; position: absolute; top: 15px; left: 0; width: 100%; height: 4px; background: #eee; z-index: 1; }
        .track-step { z-index: 2; text-align: center; font-size: 0.7rem; color: #999; width: 25%; }
        .track-dot { width: 30px; height: 30px; background: #eee; border-radius: 50%; margin: 0 auto 5px; border: 4px solid white; transition: 0.5s; }
        .active-step .track-dot { background: #0072ff; box-shadow: 0 0 15px #0072ff; }
        .active-step { color: #0072ff; font-weight: 800; }

        /* AUTH BOX */
        #auth-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: flex; justify-content: center; align-items: center; z-index: 9999; }
        .auth-card { background: white; color: #1a1a1a; padding: 50px; border-radius: 40px; text-align: center; width: 400px; animation: float 5s infinite; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }

        /* ADMIN TABLE */
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { text-align: left; padding: 10px; border-bottom: 2px solid #eee; }
    </style>
</head>
<body>

<div id="auth-overlay">
    <div class="auth-card">
        <h2 style="color:#7f00ff">NEXUS LOGIN</h2>
        <input type="text" id="email" placeholder="Email (admin@nexus.com for Admin)">
        <input type="password" id="pass" placeholder="Security Key">
        <button class="neon-btn" onclick="login()">Sync Identity</button>
    </div>
</div>

<div class="navbar" id="nav" style="display:none">
    <div style="font-weight:800">NEXUS <span id="tag" style="font-size:0.6rem; background:#7f00ff; padding:2px 6px; border-radius:5px"></span></div>
    <div style="display:flex; gap:20px" id="user-menu">
        <button onclick="tab('shop')" style="background:none; border:none; color:white; cursor:pointer">Shop</button>
        <button onclick="tab('cart')" style="background:none; border:none; color:white; cursor:pointer">Cart (<span id="count">0</span>)</button>
        <button onclick="tab('track')" style="background:none; border:none; color:white; cursor:pointer">Tracking</button>
    </div>
    <button onclick="location.reload()" style="background:none; border:none; color:#ff416c; font-weight:700; cursor:pointer">Logout</button>
</div>

<div id="shop" class="container">
    <h2 style="margin-bottom:20px">Interstellar Market</h2>
    <div id="product-grid" style="display:grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap:20px"></div>
</div>

<div id="cart" class="container">
    <div class="glass-card" style="max-width:500px; margin:0 auto">
        <h3>Checkout Hangar</h3>
        <div id="items-list" style="margin:20px 0"></div>
        <h2 id="total-price">Total: $0</h2>
        <button class="neon-btn" onclick="showPay()">Finalize Order</button>
    </div>
</div>

<div id="track" class="container">
    <h2 style="margin-bottom:20px">Shipment Tracker</h2>
    <div id="orders-list"></div>
</div>

<div id="admin" class="container">
    <h2 style="margin-bottom:20px">Galaxy Command Dashboard</h2>
    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:20px">
        <div class="glass-card"><canvas id="revChart"></canvas></div>
        <div class="glass-card">
            <h3>Inventory Management</h3>
            <input type="text" id="adm-n" placeholder="Product Name">
            <input type="number" id="adm-p" placeholder="Price">
            <button class="neon-btn" onclick="addProduct()">Add Item</button>
        </div>
        <div class="glass-card" style="grid-column: span 2;">
            <h3>Active Space Shipments</h3>
            <table>
                <thead>
                    <tr>
                        <th>Order ID</th>
                        <th>Payload & Destination</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="admin-orders-table"></tbody>
            </table>
        </div>
    </div>
</div>

<div id="pay-modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.8); z-index:5000; justify-content:center; align-items:center">
    <div class="glass-card" style="width:400px">
        <h3>Secure Payment</h3>
        <select id="p-method" onchange="toggleP()">
            <option value="card">Debit/Credit Card</option>
            <option value="upi">UPI</option>
        </select>
        <div id="card-in"><input type="text" placeholder="Card Number" maxlength="16"></div>
        <div id="upi-in" style="display:none"><input type="text" placeholder="upi@handle"></div>
        <button class="neon-btn" onclick="completeOrder()">Pay Now</button>
        <button onclick="document.getElementById('pay-modal').style.display='none'" style="margin-top:10px; background:none; border:none; width:100%; cursor:pointer">Cancel</button>
    </div>
</div>

<script>
    // --- CORE DATA ---
    let products = JSON.parse(localStorage.getItem('nx_p')) || [
        {id:1, name:"Nova Watch", price:120}, 
        {id:2, name:"Quantum Core", price:500}
    ];
    let orders = JSON.parse(localStorage.getItem('nx_o')) || [];
    let cart = [];
    let currentUser = null;

    // --- AUTH ---
    function login() {
        const e = document.getElementById('email').value;
        document.getElementById('auth-overlay').style.display = 'none';
        document.getElementById('nav').style.display = 'flex';
        if(e === 'admin@nexus.com') {
            currentUser = {role:'admin'};
            tab('admin');
            initAdmin();
        } else {
            currentUser = {role:'user'};
            tab('shop');
            renderShop();
        }
        document.getElementById('tag').innerText = currentUser.role.toUpperCase();
    }

    // --- NAVIGATION ---
    function tab(id) {
        document.querySelectorAll('.container').forEach(c => c.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if(id === 'track') renderTracking();
        if(id === 'cart') renderCart();
        if(id === 'admin') renderAdminOrders();
    }

    // --- SHOP & CART ---
    function renderShop() {
        document.getElementById('product-grid').innerHTML = products.map(p => `
            <div class="glass-card">
                <h3>${p.name}</h3>
                <p style="color:#7f00ff; font-weight:800">$${p.price}</p>
                <button class="neon-btn" style="padding:8px; margin-top:10px" onclick="addToCart(${p.id})">Add to Cart</button>
            </div>
        `).join('');
    }

    function addToCart(id) {
        cart.push(products.find(p => p.id === id));
        document.getElementById('count').innerText = cart.length;
    }

    function renderCart() {
        let t = applyFuelCredits();
        document.getElementById('items-list').innerHTML = cart.map(i => `<p>${i.name} - $${i.price}</p>`).join('');
    }

    function applyFuelCredits() {
        const creditBalance = orders.length * 10; 
        let currentTotal = cart.reduce((s, i) => s + i.price, 0);
        let finalTotal = currentTotal;
        
        if (creditBalance > 0 && currentTotal > 0) {
            const discount = Math.min(currentTotal, creditBalance);
            finalTotal = currentTotal - discount;
            document.getElementById('total-price').innerHTML = `Total: $${finalTotal} <br><span style="font-size:0.8rem; color:#10b981">(-$${discount} Fuel Credits Applied)</span>`;
        } else {
            document.getElementById('total-price').innerText = `Total: $${currentTotal}`;
        }
        return finalTotal;
    }

    // --- LOGISTICS & TRACKING ---
    function showPay() {
        const address = prompt("Enter Galactic Delivery Address (e.g., Sector 7, Mars Colony):");
        if (address && address.trim() !== "") {
            window.currentDeliveryAddress = address; 
            document.getElementById('pay-modal').style.display = 'flex';
        } else {
            alert("Shipment denied. A valid coordinate is required.");
        }
    }

    function calculateWarpETA(status) {
        const estimates = {
            1: "4.2 Light Years (Warp Drive Spooling)",
            2: "2.8 Light Years (Exiting Solar System)",
            3: "0.5 Light Years (Approaching Atmosphere)",
            4: "0.0 Light Years (Docked at Station)"
        };
        return estimates[status] || "Calculating...";
    }

    function completeOrder() {
        let order = {
            id: "#NX" + Math.floor(Math.random()*9000),
            items: [...cart],
            status: 1,
            address: window.currentDeliveryAddress,
            date: new Date().toLocaleDateString()
        };
        orders.push(order);
        localStorage.setItem('nx_o', JSON.stringify(orders));
        cart = [];
        document.getElementById('count').innerText = 0;
        document.getElementById('pay-modal').style.display = 'none';
        alert("Shipment Dispatched!");
        tab('track');
    }

    function renderTracking() {
        document.getElementById('orders-list').innerHTML = orders.map(o => `
            <div class="glass-card">
                <div style="display:flex; justify-content:space-between">
                    <b>Order ${o.id}</b>
                    <span style="font-size:0.8rem; color:#7f00ff">${calculateWarpETA(o.status)}</span>
                </div>
                <div style="font-size:0.7rem; margin: 10px 0; color:#666">Destination: ${o.address}</div>
                <div class="track-container">
                    <div class="track-step ${o.status >= 1 ? 'active-step' : ''}"><div class="track-dot"></div>Processing</div>
                    <div class="track-step ${o.status >= 2 ? 'active-step' : ''}"><div class="track-dot"></div>Shipped</div>
                    <div class="track-step ${o.status >= 3 ? 'active-step' : ''}"><div class="track-dot"></div>In Transit</div>
                    <div class="track-step ${o.status >= 4 ? 'active-step' : ''}"><div class="track-dot"></div>Delivered</div>
                </div>
            </div>
        `).reverse().join('');
    }

    // --- ADMIN COMMANDS ---
    function initAdmin() {
        renderAdminOrders();
        new Chart(document.getElementById('revChart'), {
            type: 'line',
            data: { 
                labels: ['Jan','Feb','Mar','Apr'], 
                datasets: [{label: 'Revenue', data:[200, 500, 800, 1200], borderColor: '#00c6ff', tension: 0.4}]
            }
        });
    }

    function renderAdminOrders() {
        const tableBody = document.getElementById('admin-orders-table');
        if (!tableBody) return;
        tableBody.innerHTML = orders.map((o, index) => {
            const statusLabels = ["", "Processing", "Shipped", "In Transit", "Delivered"];
            const realIdx = orders.indexOf(o);
            return `
                <tr style="border-bottom: 1px solid #eee;">
                    <td style="padding: 15px;"><b>${o.id}</b></td>
                    <td>
                        <div>${o.items.length} Items</div>
                        <div style="font-size:0.75rem; color:#7f00ff">To: ${o.address}</div>
                    </td>
                    <td><span style="font-weight:bold; color: ${o.status === 4 ? '#10b981' : '#7f00ff'}">${statusLabels[o.status]}</span></td>
                    <td>
                        ${o.status < 4 ? 
                            `<button class="neon-btn" style="padding:5px 10px; font-size:0.7rem; width:auto" onclick="advanceStatus(${realIdx})">Advance Status</button>` 
                            : '✅ Mission Success'}
                    </td>
                </tr>
            `;
        }).reverse().join('');
    }

    function advanceStatus(idx) {
        orders[idx].status++;
        localStorage.setItem('nx_o', JSON.stringify(orders));
        renderAdminOrders();
    }

    function addProduct() {
        let n = document.getElementById('adm-n').value;
        let p = document.getElementById('adm-p').value;
        if(n && p) {
            products.push({id: Date.now(), name: n, price: parseInt(p)});
            localStorage.setItem('nx_p', JSON.stringify(products));
            alert("Inventory Updated!");
            document.getElementById('adm-n').value = '';
            document.getElementById('adm-p').value = '';
        }
    }

    function toggleP() {
        let m = document.getElementById('p-method').value;
        document.getElementById('card-in').style.display = m === 'card' ? 'block' : 'none';
        document.getElementById('upi-in').style.display = m === 'upi' ? 'block' : 'none';
    }
</script>

</body>
</html>
